<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一元机场 — 管理后台">
  <title>一元机场 — 管理后台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper" id="admin-page">

    <!-- Admin Login -->
    <div id="admin-login-section">
      <div class="glass-card">
        <div class="ink-seal">管</div>
        <h1 class="brand" style="font-size:1.8rem;">管理员<span class="accent">后台</span></h1>
        <p class="subtitle">请输入管理员密码</p>
        <form id="admin-login-form" autocomplete="off">
          <div class="form-group">
            <label for="admin-pass">管理员密码</label>
            <input type="password" id="admin-pass" placeholder="请输入后台密码" required>
            <div class="error-text" id="admin-pass-error"></div>
          </div>
          <button type="submit" class="btn btn-primary">进入后台</button>
        </form>
      </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard-section" style="display:none; width:100%; max-width:1100px;">
      <div class="top-bar admin-wide">
        <h2 style="letter-spacing:2px;color:var(--ink-dark);">🔒 管理员后台</h2>
        <button class="btn btn-outline btn-small" id="btn-admin-logout">退出后台</button>
      </div>

      <div class="glass-card admin-wide">
        <!-- Admin Tabs -->
        <div class="admin-tabs">
          <button class="admin-tab-btn active" data-panel="panel-users">📧 注册用户</button>
          <button class="admin-tab-btn" data-panel="panel-orders">📦 订单管理</button>
        </div>

        <!-- Users Panel -->
        <div class="admin-panel active" id="panel-users">
          <h2 class="section-title">注册用户列表</h2>
          <table class="admin-table" id="users-table">
            <thead>
              <tr>
                <th style="width:60px">#</th>
                <th>注册邮箱</th>
                <th>验证码</th>
                <th style="width:200px">注册时间</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <!-- Orders Panel -->
        <div class="admin-panel" id="panel-orders">
          <h2 class="section-title">订单管理</h2>
          <table class="admin-table" id="orders-table">
            <thead>
              <tr>
                <th>订单号</th>
                <th>用户邮箱</th>
                <th>套餐</th>
                <th>金额</th>
                <th>状态</th>
                <th>时间</th>
                <th style="min-width:240px">操作 / 节点</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
